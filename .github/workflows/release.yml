# Builds the Claude Desktop bundle for a published release from the tagged files, signs a build
# provenance attestation for it (Sigstore, through GitHub's OIDC token; no stored keys), and
# attaches the bundle and its signature bundle to the release.
#
# Verify a download:  gh attestation verify canli-validation.mcpb --repo arhancanli/canli-validation-mcp
name: Release bundle

on:
  release:
    types: [published]

permissions: read-all

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build the bundle from the committed files at the tag
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$TAG" || { echo "tag $TAG != package.json $version"; exit 1; }
          test "$version" = "$(node -p "require('./mcpb/manifest.json').version")" || { echo "manifest version differs"; exit 1; }
          stage="$(mktemp -d)"
          git archive HEAD src package.json package-lock.json LICENSE README.md mcpb/manifest.json mcpb/icon.png | tar -x -C "$stage"
          mv "$stage/mcpb/manifest.json" "$stage/mcpb/icon.png" "$stage/" && rmdir "$stage/mcpb"
          (cd "$stage" && npm ci --omit=dev --ignore-scripts --silent)
          mkdir -p dist
          npx --yes @anthropic-ai/mcpb@2.1.2 validate "$stage/manifest.json"
          npx --yes @anthropic-ai/mcpb@2.1.2 pack "$stage" "dist/canli-validation-mcp-$version.mcpb"
          cp "dist/canli-validation-mcp-$version.mcpb" dist/canli-validation.mcpb
          (cd dist && sha256sum *.mcpb > SHA256SUMS.txt)
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.mcpb
      - name: Attach the bundle, checksums and signed provenance to the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" dist/canli-validation.mcpb.sigstore.json
          gh release upload "$TAG" dist/*.mcpb dist/SHA256SUMS.txt dist/canli-validation.mcpb.sigstore.json --clobber --repo "$GITHUB_REPOSITORY"
